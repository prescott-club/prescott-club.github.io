<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prescott Club — Administración</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.admin-wrap{max-width:1100px;margin:auto;padding:35px 20px}
.admin-box{max-width:420px;margin:70px auto;padding:35px;background:#f7f2e9;color:#3d2925}
.admin-box input,.admin-box button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box}
.admin-dashboard{display:none}
.admin-nav{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}
.admin-nav button{padding:12px 20px;cursor:pointer}
.admin-section{display:none}
.admin-section.active{display:block}
.admin-table{width:100%;border-collapse:collapse;overflow:auto}
.admin-table th,.admin-table td{padding:12px;border-bottom:1px solid #ddd;text-align:left}
</style>
</head>

<body class="admin-page">

<div class="admin-wrap">

<div id="login" class="admin-box">
<p>PRESCOTT CLUB</p>
<h1>Administración</h1>

<input id="email" type="email" placeholder="Correo electrónico">
<input id="password" type="password" placeholder="Contraseña">

<button id="loginBtn">Iniciar sesión</button>
<p id="message"></p>
<a href="index.html">Volver a la tienda</a>
</div>

<div id="dashboard" class="admin-dashboard">

<header>
<h1>Prescott Club</h1>
<p>Panel de administración</p>
<button id="logoutBtn">Cerrar sesión</button>
</header>

<nav class="admin-nav">
<button onclick="showSection('orders')">Pedidos</button>
<button onclick="showSection('products')">Productos</button>
<button onclick="showSection('stats')">Ventas</button>
</nav>

<section id="orders" class="admin-section active">
<h2>Pedidos</h2>
<div id="ordersContent">Cargando pedidos...</div>
</section>

<section id="products" class="admin-section">
<h2>Productos</h2>
<div id="productsContent">Cargando productos...</div>
</section>

<section id="stats" class="admin-section">
<h2>Ventas</h2>
<div id="statsContent">Cargando...</div>
</section>

</div>
</div>

<script>
const SUPABASE_URL = "https://inrqvnddcjaarjrwqbei.supabase.co";
const SUPABASE_KEY = "sb_publishable_OuYXRM31Ih71RVCswfTOsw_S9zXTXMU";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginBox = document.getElementById("login");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

function showSection(id) {
  document.querySelectorAll(".admin-section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

async function checkAdmin() {
  const { data: { user }, error: authError } = await sb.auth.getUser();

  if (authError) {
    message.textContent = "Error de sesión: " + authError.message;
    return;
  }

  if (!user) {
    message.textContent = "No hay sesión iniciada.";
    return;
  }

  const { data, error } = await sb
    .from("admin_users")
    .select("user_id")
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) {
    message.textContent = "Error verificando administrador: " + error.message;
    return;
  }

  if (!data) {
    message.textContent = "La cuenta no aparece como administradora.";
    return;
  }

  loginBox.style.display = "none";
  dashboard.style.display = "block";

  loadOrders();
  loadProducts();
  loadStats();
}

document.getElementById("loginBtn").onclick = async () => {
  message.textContent = "Iniciando sesión...";

  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById("email").value,
    password: document.getElementById("password").value
  });

  if (error) {
    message.textContent = "Correo o contraseña incorrectos.";
    return;
  }

  checkAdmin();
};

document.getElementById("logoutBtn").onclick = async () => {
  await sb.auth.signOut();
  location.reload();
};

async function loadOrders() {
  const { data, error } = await sb
    .from("orders")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    document.getElementById("ordersContent").textContent = error.message;
    return;
  }

  if (!data.length) {
    document.getElementById("ordersContent").innerHTML = "Todavía no hay pedidos.";
    return;
  }

  document.getElementById("ordersContent").innerHTML = `
    <table class="admin-table">
      <tr>
        <th>Cliente</th>
        <th>Teléfono</th>
        <th>Total</th>
        <th>Estado</th>
        <th>Fecha</th>
      </tr>
      ${data.map(o => `
        <tr>
          <td>${o.customer_name || ""}</td>
          <td>${o.phone || ""}</td>
          <td>$${Number(o.total || 0).toFixed(2)}</td>
          <td>${o.status || "Pendiente"}</td>
          <td>${new Date(o.created_at).toLocaleDateString()}</td>
        </tr>
      `).join("")}
    </table>`;
}

async function loadProducts() {
  const { data, error } = await sb
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    document.getElementById("productsContent").textContent = error.message;
    return;
  }

  document.getElementById("productsContent").innerHTML =
    data.length ? `
    <table class="admin-table">
      <tr><th>Producto</th><th>Precio</th><th>Stock</th><th>Activo</th></tr>
      ${data.map(p => `
        <tr>
          <td>${p.name}</td>
          <td>$${Number(p.price).toFixed(2)}</td>
          <td>${p.stock}</td>
          <td>${p.active ? "Sí" : "No"}</td>
        </tr>
      `).join("")}
    </table>` : "Todavía no hay productos registrados en la base de datos.";
}

async function loadStats() {
  const { data, error } = await sb
    .from("orders")
    .select("total");

  if (error) {
    document.getElementById("statsContent").textContent = error.message;
    return;
  }

  const total = data.reduce((sum, o) => sum + Number(o.total || 0), 0);

  document.getElementById("statsContent").innerHTML = `
    <h3>Total de pedidos: ${data.length}</h3>
    <h2>Ventas registradas: $${total.toFixed(2)}</h2>
  `;
}

checkAdmin();
</script>

</body>
</html>
